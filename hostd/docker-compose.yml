# hostd: the service the client portal will call to control client sites. Deployed on its own, like
# mail/. Nothing is published on the host: api is reachable only on the hostd network, and the agent has
# no network at all in phase 1.

name: hostd

services:
  agent:
    build:
      context: .
      target: agent
    container_name: hostd-agent
    # Root, because it holds the Docker socket. It listens only on the Unix socket in hostd-sock.
    network_mode: none
    environment:
      HOSTD_REGISTRY_FILE: /etc/hostd/registry/projects.yaml
      HOSTD_AGENT_SOCKET: /run/hostd/agent.sock
      HOSTD_FETCH_SOCKET: /run/hostd-fetch/fetch.sock
      # The node user's group in the api image, so api can connect and nothing else can.
      HOSTD_SOCKET_GID: "1000"
      HOSTD_STATUS_FILE: /tmp/hostd-status.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The same path inside as outside: compose hands bind mount sources to the daemon as host paths.
      # Writable now: provisioning writes env files and swaps trees under here.
      - /var/www:/var/www
      # The registry's directory, not the file: a single-file bind mount pins the container to one
      # inode, so an editor, sed -i, or registry-write.ts's own atomic rename replacing the file detaches
      # the mount silently and every later edit (or write) is invisible. registry/ holds nothing but the
      # registry, so neither container gains sight of .env or .env.agent. Writable only here, because
      # provisioning writes it; api gets it read-only below.
      - ./registry:/etc/hostd/registry
      - hostd-sock:/run/hostd
      # Shared only with fetcher, never with api: api must never be able to reach the fetch protocol
      # directly, and fetcher must never be able to touch agent.sock (in hostd-sock) to impersonate the
      # agent to api. See fetcher's own volumes below for the other half of this.
      - hostd-fetch-sock:/run/hostd-fetch
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "src/shared/healthcheck.ts", "/tmp/hostd-status.json"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    container_name: hostd-api
    env_file: .env
    environment:
      HOSTD_REGISTRY_FILE: /etc/hostd/registry/projects.yaml
      HOSTD_AGENT_SOCKET: /run/hostd/agent.sock
      HOSTD_STATE_DIR: /state
      HOSTD_STATUS_FILE: /tmp/hostd-status.json
    volumes:
      # The directory, for the reason given on the agent's mount above. Read-only: api never writes the
      # registry itself, even for provisioning, which goes through the agent.
      - ./registry:/etc/hostd/registry:ro
      - hostd-state:/state
      - hostd-sock:/run/hostd
    networks:
      - hostd
    depends_on:
      - agent
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "src/shared/healthcheck.ts", "/tmp/hostd-status.json"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  fetcher:
    build:
      context: .
      target: fetcher
    container_name: hostd-fetcher
    env_file: .env.fetcher
    environment:
      HOSTD_FETCH_SOCKET: /run/hostd-fetch/fetch.sock
    volumes:
      - /var/www:/var/www
      # No registry mount: the fetcher never reads it (it only ever does what the agent tells it to, over
      # the fetch socket below), so it does not get a copy of client data it has no use for.
      #
      # The socket volume is its own, shared only with agent: never hostd-sock, and never api. A
      # compromise here can therefore never reach agent.sock to speak the agent's own protocol, or
      # overwrite it to impersonate the agent to api.
      - hostd-fetch-sock:/run/hostd-fetch
    networks:
      # It clones from and fetches GitHub, unlike agent and api. It never gets the Docker socket.
      - hostd
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "src/shared/healthcheck.ts", "/tmp/hostd-status.json"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    restart: unless-stopped

networks:
  hostd:
    name: hostd

volumes:
  hostd-state:
  hostd-sock:
  hostd-fetch-sock:
