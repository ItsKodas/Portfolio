# The registry of client projects. Copy to projects.yaml beside this file on the dedi (gitignored: it
# names clients). Both hostd and the agent write it now, the agent only for provisioning; a hand edit
# takes effect within 10 seconds, and one that breaks the file is rejected as a whole, leaving the last
# good version in force. Both containers mount this directory rather than the file, so any editor's save
# is seen, however it writes.

# Hostnames at or below these are never accepted as client domains.
reserved: [horizons.gg]

# Exact hostnames exempted from the rule above, for the one test name domain verification needs on the
# dedi. Exact names only: this never exempts the subtree below an entry. The apex horizons.gg and
# anything under dev.horizons.gg (the mail stack) are refused here whatever this says, and listing one
# rejects the whole file.
# allowed: [test.hostd.horizons.gg]

# Offsite backup retention, which only the operator sets (phase 2).
offsite:
  keep: { daily: 14, weekly: 8, monthly: 6 }

projects:
  # The id is also the compose project name. It must match what `docker compose ls` shows for the site,
  # or the compose file must say `name: <id>`.
  #
  # An entry with dir and upstream and no environments, like this one, means live only: dir,
  # composePaths and upstream keep meaning exactly what they mean today.
  acme-bakery:
    client: cl_8f2k1              # the portal's client id
    name: Acme Bakery
    dir: /var/www/acme-bakery     # exactly one segment below /var/www
    compose: docker-compose.yml   # relative to dir; a list when the site runs with more than one,
                                  # e.g. [docker-compose.yml, docker-compose.override.yml], in the
                                  # order compose merges them. Name every file the site runs with:
                                  # hostd passes each as -f, which stops compose picking up an
                                  # override by itself.
    upstream: 127.0.0.1:5010      # what the vhost will proxy to (phase 4)
    services:
      web: { role: site }
      db: { role: database, engine: postgres }   # postgres | mysql | mariadb | mongodb | sqlite | redis | generic
    storage:
      # Each must be a bind mount of a site service, must not be mounted into a database service, and
      # must not contain the compose file, an env file, a build context or a Dockerfile.
      media: { path: uploads, mode: rw }         # rw | ro | hidden (backed up, never shown)
    capabilities: [lifecycle, logs]              # lifecycle | logs | files | backups | domains | provision | env

  # A project with a live and a test environment. Each environment has its own folder, branch, domain,
  # port and certificate mode; repo, limits and portEnv live at the project level and apply to both.
  # widget-shop:
  #   client: cl_2p9qz
  #   name: Widget Shop
  #   repo: git@github.com:ItsKodas/widget-shop.git    # ssh or https git URL; required if any environment sets branch
  #   portEnv: WEB_PORT                                # the env var the compose file reads its port from (default WEB_PORT)
  #   limits:
  #     memory: 1g                                     # <number>(b|k|m|g), default 1g
  #     cpus: '1'                                      # <number>, default 1
  #   services:
  #     web: { role: site }
  #     db: { role: database, engine: postgres }
  #   capabilities: [lifecycle, logs]
  #   environments:
  #     live:
  #       dir: /var/www/widget-shop
  #       compose: docker-compose.yml       # relative to dir, default docker-compose.yml; a list when
  #                                         # this environment runs with more than one file, same as the
  #                                         # project-level compose key above
  #       branch: main
  #       domain: widgetshop.com
  #       aliases: [www.widgetshop.com]  # served, and each one 301s to the domain above. The domain
  #                                      # plus its aliases must not exceed maxDomains (default 3).
  #       port: 5020
  #       certificate: letsencrypt          # letsencrypt | cloudflare-origin
  #       deployed: 3f7c1a2                 # the commit currently checked out, set by hostd itself
  #     test:
  #       dir: /var/www/widget-shop-test
  #       branch: develop
  #       domain: test.widgetshop.com
  #       port: 5120
  #       certificate: cloudflare-origin
