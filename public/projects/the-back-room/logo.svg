<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="The Back Room">
  <title>The Back Room</title>
  <!--
    A chip, because that is the only thing this place deals in.

    Drawn down to what survives sixteen pixels: the clay, four spots in the
    rim, and the inlay. The real chip in the app has a pale centre so a
    printed number has a ground to sit on; there is no number at this size, so
    the inlay takes the gold instead and the whole mark reads as money.

    The rim spots are what make a circle read as a chip rather than as a coin,
    which is why they are the one piece of detail kept.
  -->
  <circle cx="16" cy="16" r="15.2" fill="#171b22"/>
  <g fill="none" stroke="#e0b048" stroke-width="3.6">
    <path d="M 8.73 5.22 A 13.0 13.0 0 0 1 23.27 5.22"/>
    <path d="M 26.78 8.73 A 13.0 13.0 0 0 1 26.78 23.27"/>
    <path d="M 23.27 26.78 A 13.0 13.0 0 0 1 8.73 26.78"/>
    <path d="M 5.22 23.27 A 13.0 13.0 0 0 1 5.22 8.73"/>
  </g>
  <circle cx="16" cy="16" r="5.6" fill="#e0b048"/>
</svg>
