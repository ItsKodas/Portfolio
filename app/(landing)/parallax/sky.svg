<svg xmlns="http://www.w3.org/2000/svg" width="3904" height="4396" viewBox="0 0 3904 4396">
    <defs>
        <!-- Base sky: three vertical gradients (pink left, lilac middle, teal right) blended across -->
        <linearGradient id="skyLeft" x1="0" y1="0" x2="0" y2="2198" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#43588b"/>
            <stop offset="0.17" stop-color="#56598f"/>
            <stop offset="0.3" stop-color="#746796"/>
            <stop offset="0.43" stop-color="#a987bc"/>
            <stop offset="0.52" stop-color="#c7a0dc"/>
            <stop offset="0.58" stop-color="#c290c4"/>
            <stop offset="0.64" stop-color="#b06b99"/>
            <stop offset="0.7" stop-color="#895a98"/>
            <stop offset="0.77" stop-color="#4f538b"/>
            <stop offset="0.9" stop-color="#394b7f"/>
            <stop offset="1" stop-color="#354574"/>
        </linearGradient>
        <linearGradient id="skyMid" x1="0" y1="0" x2="0" y2="2198" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#2f5c8b"/>
            <stop offset="0.17" stop-color="#395b8a"/>
            <stop offset="0.3" stop-color="#45588d"/>
            <stop offset="0.43" stop-color="#63699e"/>
            <stop offset="0.5" stop-color="#7973a7"/>
            <stop offset="0.57" stop-color="#9a80b2"/>
            <stop offset="0.63" stop-color="#8a78ad"/>
            <stop offset="0.7" stop-color="#555e95"/>
            <stop offset="0.77" stop-color="#404f83"/>
            <stop offset="0.9" stop-color="#264571"/>
            <stop offset="1" stop-color="#1f4169"/>
        </linearGradient>
        <linearGradient id="skyRight" x1="0" y1="0" x2="0" y2="2198" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#1f4c77"/>
            <stop offset="0.17" stop-color="#235987"/>
            <stop offset="0.3" stop-color="#26709e"/>
            <stop offset="0.43" stop-color="#2f83be"/>
            <stop offset="0.5" stop-color="#4ba7d4"/>
            <stop offset="0.57" stop-color="#6fc0de"/>
            <stop offset="0.63" stop-color="#74d1eb"/>
            <stop offset="0.7" stop-color="#46a7c3"/>
            <stop offset="0.77" stop-color="#2f6a93"/>
            <stop offset="0.9" stop-color="#25537b"/>
            <stop offset="1" stop-color="#224e76"/>
        </linearGradient>

        <linearGradient id="fadeFromLeft" x1="0" y1="0" x2="3904" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#fff"/>
            <stop offset="0.45" stop-color="#000"/>
        </linearGradient>
        <linearGradient id="fadeFromRight" x1="0" y1="0" x2="3904" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0.6" stop-color="#000"/>
            <stop offset="1" stop-color="#fff"/>
        </linearGradient>
        <mask id="leftMask"><rect width="3904" height="2198" fill="url(#fadeFromLeft)"/></mask>
        <mask id="rightMask"><rect width="3904" height="2198" fill="url(#fadeFromRight)"/></mask>

        <!-- Glows -->
        <radialGradient id="glowPink">
            <stop offset="0" stop-color="#e0619f" stop-opacity="0.85"/>
            <stop offset="0.5" stop-color="#d0709f" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#b06b99" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glowLilac">
            <stop offset="0" stop-color="#e8a9cc" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#b48fcf" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glowCyan">
            <stop offset="0" stop-color="#9ff0f5" stop-opacity="0.8"/>
            <stop offset="0.5" stop-color="#6fd6ea" stop-opacity="0.35"/>
            <stop offset="1" stop-color="#46a7c3" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glowBlue">
            <stop offset="0" stop-color="#2b8fe6" stop-opacity="0.75"/>
            <stop offset="1" stop-color="#2f83be" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glowViolet">
            <stop offset="0" stop-color="#cf9df0" stop-opacity="0.6"/>
            <stop offset="1" stop-color="#a987bc" stop-opacity="0"/>
        </radialGradient>

        <!-- Horizon cloud banks -->
        <linearGradient id="cloudsWarm" x1="0" y1="0" x2="2300" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#d45a9c"/>
            <stop offset="0.35" stop-color="#e3869f"/>
            <stop offset="0.6" stop-color="#c890c8"/>
            <stop offset="1" stop-color="#e7a3bd"/>
        </linearGradient>
        <linearGradient id="cloudsCool" x1="2000" y1="0" x2="3904" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#a9c9ec"/>
            <stop offset="0.5" stop-color="#a6dcef"/>
            <stop offset="1" stop-color="#8fe8f2"/>
        </linearGradient>
        <linearGradient id="cloudFade" x1="0" y1="1250" x2="0" y2="1750" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#fff"/>
            <stop offset="0.25" stop-color="#fff"/>
            <stop offset="0.6" stop-color="#666"/>
            <stop offset="1" stop-color="#000"/>
        </linearGradient>
        <mask id="cloudMask"><rect y="1000" width="3904" height="1000" fill="url(#cloudFade)"/></mask>

        <filter id="soft" x="-10%" y="-50%" width="120%" height="200%">
            <feGaussianBlur stdDeviation="22"/>
        </filter>
        <filter id="softer" x="-10%" y="-100%" width="120%" height="300%">
            <feGaussianBlur stdDeviation="45"/>
        </filter>
        <!-- Same fade as the main band, but across the whole sky so the tails match the band where they leave it -->
        <linearGradient id="tailFade" x1="-20" x2="3900" y1="0" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#c882b4"/>
            <stop offset="0.45" stop-color="#b877a8"/>
            <stop offset="1" stop-color="#9a6fa5" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="bandFade" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#c882b4"/>
            <stop offset="0.55" stop-color="#b877a8"/>
            <stop offset="1" stop-color="#9a6fa5" stop-opacity="0.2"/>
        </linearGradient>
        <linearGradient id="faintRidge" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#9c80b6"/>
            <stop offset="1" stop-color="#9c80b6" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="faintSlate" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#6e7cb0"/>
            <stop offset="1" stop-color="#6e7cb0" stop-opacity="0"/>
        </linearGradient>
    </defs>

    <!-- Base -->
    <rect width="3904" height="2198" fill="url(#skyMid)"/>
    <rect width="3904" height="2198" fill="url(#skyLeft)" mask="url(#leftMask)"/>
    <rect width="3904" height="2198" fill="url(#skyRight)" mask="url(#rightMask)"/>

    <!-- Big soft glows -->
    <ellipse cx="3600" cy="1130" rx="560" ry="250" fill="url(#glowBlue)"/>
    <ellipse cx="3100" cy="1780" rx="1300" ry="320" fill="url(#glowCyan)" opacity="0.3"/>
    <ellipse cx="3650" cy="1440" rx="900" ry="260" fill="url(#glowCyan)"/>
    <ellipse cx="300" cy="1180" rx="700" ry="200" fill="url(#glowViolet)"/>
    <ellipse cx="450" cy="1440" rx="900" ry="220" fill="url(#glowPink)"/>
    <ellipse cx="1850" cy="1330" rx="700" ry="160" fill="url(#glowLilac)"/>

    <!-- Pink brush streaks, upper left: crisp painted bands fading out along their length -->
    <g fill="url(#bandFade)" transform="rotate(2.2 3050 820)">
        <path d="M-20 728 C1341 722 2682 732 3050 820 C2682 870 1341 882 -20 878Z" opacity="0.33"/>
        <!-- Thin streaks trailing off the end of the main band -->
        <path fill="url(#tailFade)" d="M2050 748 Q2491 741 3520 792 Q2491 773 2050 748Z" opacity="0.27"/>
        <path fill="url(#tailFade)" d="M2350 792 Q2779 795 3780 846 Q2779 817 2350 792Z" opacity="0.23"/>
        <path fill="url(#tailFade)" d="M2550 850 Q2854 849 3420 884 Q2854 875 2550 850Z" opacity="0.23"/>
        <path fill="url(#tailFade)" d="M2800 818 Q3130 824 3900 866 Q3130 840 2800 818Z" opacity="0.2"/>
        <path d="M-20 940 C638 934 1276 944 1560 1005 C1276 1037 638 1049 -20 1045Z" opacity="0.34"/>
        <path d="M-20 1100 C578 1094 1156 1104 1450 1160 C1156 1182 578 1194 -20 1190Z" opacity="0.31"/>
    </g>
    <g fill="#c77aa8">
        <path d="M380 532 Q614 516 900 524 Q614 540 380 532Z" opacity="0.26"/>
        <path d="M840 640 Q970 628 1100 635 Q970 646 840 640Z" opacity="0.22"/>
    </g>

