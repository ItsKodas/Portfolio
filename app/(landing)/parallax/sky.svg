    <!-- Faint distant mountains on the horizon -->
    <path fill="url(#faintSlate)" opacity="0.5" d="M1880 1470 L2040 1300 L2200 1170 L2330 1146 L2470 1130 L2620 1142 L2800 1176 L3010 1212 L3200 1242 L3420 1275 L3700 1380 L3860 1470Z"/>
