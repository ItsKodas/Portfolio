<svg xmlns="http://www.w3.org/2000/svg" width="3904" height="4396" viewBox="0 0 3904 4396">
    <!-- Night sky behind the mountains: deep blue overhead, a pink and lilac dusk glow low on the left, a teal glow low
         on the right, and a few painted streaks. The horizon (where the mountains start) sits around y=1100. -->
    <defs>
        <!-- Base: deep blue at the top, lightening to lilac towards the horizon -->
        <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="2198">
            <stop offset="0" stop-color="#2b3b6c"/>
            <stop offset="0.2" stop-color="#34487c"/>
            <stop offset="0.36" stop-color="#4b5690"/>
            <stop offset="0.48" stop-color="#7a74ab"/>
            <stop offset="0.56" stop-color="#8c80b4"/>
            <stop offset="0.66" stop-color="#4b5a8e"/>
            <stop offset="1" stop-color="#2a3a68"/>
        </linearGradient>

        <!-- Top left leans purple, top right leans teal -->
        <radialGradient id="purpleTop" gradientUnits="userSpaceOnUse" cx="200" cy="500" r="1900">
            <stop offset="0" stop-color="#5a4f93" stop-opacity="0.75"/>
            <stop offset="1" stop-color="#5a4f93" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="tealTop" gradientUnits="userSpaceOnUse" cx="3500" cy="300" r="2000">
            <stop offset="0" stop-color="#1f6d96" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#1f6d96" stop-opacity="0"/>
        </radialGradient>

        <!-- Horizon glows -->
        <radialGradient id="pinkGlow" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(700 1110) scale(1500 400)">
            <stop offset="0" stop-color="#f19bb3" stop-opacity="0.95"/>
            <stop offset="0.45" stop-color="#d886ad" stop-opacity="0.6"/>
            <stop offset="1" stop-color="#b877ac" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="lilacGlow" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(1700 1120) scale(1300 360)">
            <stop offset="0" stop-color="#b597cc" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#b597cc" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="tealGlow" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(3800 980) scale(1650 700)">
            <stop offset="0" stop-color="#43cfd6" stop-opacity="0.85"/>
            <stop offset="0.5" stop-color="#34a6c3" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#2a86b0" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="blueGlow" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(2750 1060) scale(1100 330)">
            <stop offset="0" stop-color="#6fa6d4" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#6fa6d4" stop-opacity="0"/>
        </radialGradient>

        <!-- Streak fades: solid in the middle, fading out towards both ends -->
        <linearGradient id="pinkStreak" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#d58bb4" stop-opacity="0"/>
            <stop offset="0.25" stop-color="#d58bb4" stop-opacity="1"/>
            <stop offset="0.7" stop-color="#c77fb0" stop-opacity="0.8"/>
            <stop offset="1" stop-color="#c77fb0" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="lilacBand" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#9b82bd" stop-opacity="0.9"/>
            <stop offset="0.55" stop-color="#8f84bd" stop-opacity="0.5"/>
            <stop offset="1" stop-color="#7f86bd" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="blueSwoosh" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#5f9fcc" stop-opacity="0"/>
            <stop offset="0.4" stop-color="#5f9fcc" stop-opacity="1"/>
            <stop offset="1" stop-color="#5f9fcc" stop-opacity="0"/>
        </linearGradient>
    </defs>

    <!-- Base and colour washes -->
    <rect width="3904" height="4396" fill="url(#base)"/>
    <rect width="3904" height="2200" fill="url(#purpleTop)"/>
    <rect width="3904" height="2200" fill="url(#tealTop)"/>

    <!-- Broad lighter band crossing the middle of the sky, strongest on the left -->
    <path d="M0 740 Q1200 700 2500 790 Q3200 840 3904 900 L3904 960 Q3100 900 2400 870 Q1200 820 0 860Z" fill="url(#lilacBand)" opacity="0.25"/>

    <!-- Horizon glows -->
    <rect y="500" width="3904" height="1200" fill="url(#lilacGlow)"/>
    <rect y="500" width="3904" height="1200" fill="url(#blueGlow)"/>
    <rect y="500" width="3904" height="1200" fill="url(#pinkGlow)"/>
    <rect y="100" width="3904" height="1500" fill="url(#tealGlow)"/>

    <!-- Thin pink streaks, upper left: tapered at both ends -->
    <path d="M340 530 Q700 512 1020 520 Q700 540 340 530Z" fill="url(#pinkStreak)" opacity="0.5"/>
    <path d="M820 640 Q1200 620 1560 628 Q1200 652 820 640Z" fill="url(#pinkStreak)" opacity="0.4"/>
    <path d="M60 780 Q900 755 1900 770 Q900 800 60 780Z" fill="url(#pinkStreak)" opacity="0.3"/>
    <path d="M1300 860 Q1900 845 2500 856 Q1900 876 1300 860Z" fill="url(#pinkStreak)" opacity="0.22"/>

    <!-- Faint light swooshes, upper right -->
    <path d="M1900 150 Q2800 110 3700 170 Q2800 150 1900 150Z" fill="url(#blueSwoosh)" opacity="0.18"/>
    <path d="M2300 300 Q3000 260 3904 330 Q3000 305 2300 300Z" fill="url(#blueSwoosh)" opacity="0.15"/>
    <path d="M1500 420 Q2400 380 3300 440 Q2400 432 1500 420Z" fill="url(#blueSwoosh)" opacity="0.12"/>
</svg>
