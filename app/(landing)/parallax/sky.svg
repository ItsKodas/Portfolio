    <ellipse cx="1900" cy="1560" rx="2300" ry="160" fill="#8a9bd0" opacity="0.14" filter="url(#softer)"/>
    <ellipse cx="3400" cy="1500" rx="900" ry="90" fill="#8fe8f2" opacity="0.25" filter="url(#softer)"/>

